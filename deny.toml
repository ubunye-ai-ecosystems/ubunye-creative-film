# Ubunye supply-chain policy (cargo-deny). Shared across ubunye-creative-* repos.
[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
  # Known at import (2026-10-10); each has an owner and must be removed when fixed.
  "RUSTSEC-2023-0071",  # rsa via rustls-rustcrypto (M2.3)
  "RUSTSEC-2026-0049", "RUSTSEC-2026-0098", "RUSTSEC-2026-0099", "RUSTSEC-2026-0104",  # rustls-webpki 0.102 (M2.3)
  "RUSTSEC-2024-0429",  # glib 0.18 unsound (via muda/gtk)
  "RUSTSEC-2024-0436", "RUSTSEC-2024-0370",  # unmaintained: paste, proc-macro-error
  # Came with the upstream 0.15 merge (2026-11-01), all transitive in upstream's lockfile; drop each
  # when upstream bumps it or we update Cargo.lock on its own PR (M2.3).
  "RUSTSEC-2026-0367", "RUSTSEC-2026-0368", "RUSTSEC-2026-0369",  # zip 7.2.0 extract (we never extract untrusted archives)
  "RUSTSEC-2026-0429",  # zip 7.2.0 ZipArchive::extract on a symlink entry: never called; candle-core and filmcraft-tts only read entries
  "RUSTSEC-2026-0382",  # rustls-webpki 0.102/0.103 distrusted intermediates
  "RUSTSEC-2026-0383",  # webpki-root-certs 1.0.9 emSign intermediates
  "RUSTSEC-2026-0387",  # crypto-bigint 0.5.5 timing (via rsa / rustls-rustcrypto, as 2023-0071)
  "RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372",  # unmaintained: zvariant, zbus_names, zvariant_derive (Linux D-Bus via accesskit/rfd)
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CDLA-Permissive-2.0", "OFL-1.1",
  "Ubuntu-font-1.0", "BSL-1.0", "CC0-1.0", "IJG", "0BSD", "bzip2-1.0.6", "NCSA",
]
exceptions = [
  # MPL-2.0 is file-level copyleft; allowed only for unmodified crates listed here.
  { allow = ["MPL-2.0"], crate = "symphonia" },
  { allow = ["MPL-2.0"], crate = "symphonia-core" },
  { allow = ["MPL-2.0"], crate = "symphonia-bundle-flac" },
  { allow = ["MPL-2.0"], crate = "symphonia-bundle-mp3" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-aac" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-alac" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-pcm" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-vorbis" },
  { allow = ["MPL-2.0"], crate = "symphonia-format-isomp4" },
  { allow = ["MPL-2.0"], crate = "symphonia-format-ogg" },
  { allow = ["MPL-2.0"], crate = "symphonia-format-riff" },
  { allow = ["MPL-2.0"], crate = "symphonia-metadata" },
  { allow = ["MPL-2.0"], crate = "symphonia-utils-xiph" },
  { allow = ["MPL-2.0"], crate = "webpki-root-certs" },
  { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"          # workspace path deps; nothing is published to crates.io
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# upstream's pinned forks (egui, winit) and the craft libraries, each at a fixed rev in Cargo.toml
allow-git = ["https://github.com/storytold/egui.git", "https://github.com/storytold/winit.git", "https://github.com/storytold/craft-libs"]
